AWSTemplateFormatVersion: '2010-09-09'
Description: Stack 3 - ALB + Target Group + Launch Template + ASG + Warm Pool

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC Id (for example, your default VPC)

  PublicSubnetId1:
    Type: AWS::EC2::Subnet::Id
    Description: First public subnet in a different AZ

  PublicSubnetId2:
    Type: AWS::EC2::Subnet::Id
    Description: Second public subnet in a different AZ

  AlbSecurityGroupId:
    Type: String
    Default: ""
    Description: Optional Security Group Id for ALB (leave empty to create one)

  Ec2SecurityGroupId:
    Type: String
    Default: ""
    Description: Optional Security Group Id for ASG instances (leave empty to create one)

  KeyName:
    Type: String
    Default: ""
    Description: Optional Key Pair name

  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2
    Description: Amazon Linux 2 AMI (SSM parameter)

  DesiredCapacity:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 4

Conditions:
  HasKeyName: !Not [ !Equals [ !Ref KeyName, "" ] ]
  NoAlbSG: !Equals [ !Ref AlbSecurityGroupId, "" ]
  NoEc2SG: !Equals [ !Ref Ec2SecurityGroupId, "" ]

Resources:
  AppLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups: !If [ NoAlbSG, [ !Ref AlbSecurityGroupCreated ], [ !Ref AlbSecurityGroupId ] ]
      Subnets:
        - !Ref PublicSubnetId1
        - !Ref PublicSubnetId2

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VpcId
      HealthCheckPath: /
      TargetType: instance

  AppListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup
      LoadBalancerArn: !Ref AppLoadBalancer
      Port: 80
      Protocol: HTTP

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmi
        InstanceType: t3.micro
        KeyName: !If [ HasKeyName, !Ref KeyName, !Ref AWS::NoValue ]
        SecurityGroupIds: !If [ NoEc2SG, [ !Ref Ec2SecurityGroupCreated ], [ !Ref Ec2SecurityGroupId ] ]
        UserData: !Base64 |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl enable httpd
          systemctl start httpd
          echo "Hello from ALB + ASG" > /var/www/html/index.html

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: 1
      MaxSize: 4
      DesiredCapacity: !Ref DesiredCapacity
      VPCZoneIdentifier:
        - !Ref PublicSubnetId1
        - !Ref PublicSubnetId2
      TargetGroupARNs:
        - !Ref AppTargetGroup
      LaunchTemplate:
        LaunchTemplateSpecification:
          LaunchTemplateId: !Ref LaunchTemplate
          Version: !GetAtt LaunchTemplate.LatestVersionNumber

  AsgWarmPool:
    Type: AWS::AutoScaling::WarmPool
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      MinSize: 1
      PoolState: Stopped

  AlbSecurityGroupCreated:
    Condition: NoAlbSG
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ALB (created by stack)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  Ec2SecurityGroupCreated:
    Condition: NoEc2SG
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EC2 instances (created by stack)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

Outputs:
  LoadBalancerDNS:
    Description: DNS name of the created Application Load Balancer
    Value: !GetAtt AppLoadBalancer.DNSName

  AutoScalingGroupName:
    Description: Name of created Auto Scaling Group
    Value: !Ref AutoScalingGroup

  LaunchTemplateId:
    Description: Launch Template Id used by ASG
    Value: !Ref LaunchTemplate

  LaunchTemplateLatestVersion:
    Description: Latest launch template version in stack 3
    Value: !GetAtt LaunchTemplate.LatestVersionNumber
