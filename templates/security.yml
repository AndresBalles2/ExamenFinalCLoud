AWSTemplateFormatVersion: '2010-09-09'
Description: Stack 1 - Security layer with EC2 and ALB security groups

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC Id (use default VPC from workflow)

Resources:
  Ec2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for public EC2 instances
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for internet-facing ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

Outputs:
  Ec2SecurityGroupId:
    Description: Security Group Id for EC2 stack
    Value: !Ref Ec2SecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-Ec2SecurityGroupId

  AlbSecurityGroupId:
    Description: Security Group Id for ALB stack
    Value: !Ref AlbSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-AlbSecurityGroupId
